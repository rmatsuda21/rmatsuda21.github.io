<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Reo Matsuda is a fullstack engineer working in React. Shared checkout for 55K+ daily users, and two Black Friday launches for 1M+ users."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rmatsuda21.github.io/" />
    <meta property="og:title" content="Reo Matsuda — Fullstack Engineer" />
    <meta
      property="og:description"
      content="Fullstack engineer working in React. Experience, projects and a few toys."
    />
    <link rel="icon" href="/favicon.ico" />
    <title>Reo Matsuda — Fullstack Engineer</title>
    <script>
      // Apply the saved revision before first paint so the sheet does not flash.
      try {
        if (localStorage.getItem("rev") === "light") {
          document.documentElement.dataset.rev = "light";
        }
      } catch (e) {}

      // Likewise the language (same order as readLang in src/i18n/lang.ts).
      try {
        var lang =
          new URLSearchParams(location.search).get("lang") ||
          localStorage.getItem("lang") ||
          navigator.language;
        if (/^ja/i.test(lang)) document.documentElement.lang = "ja";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
